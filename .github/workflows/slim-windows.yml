name: Slim Build (Windows x64)

# 仅用于开发期验证：只编 Windows x64 的 MaaCore + WPF GUI，跳过 arm64 与其它平台。
# 上游合并前应删除此文件（正式的 Release Pipeline 见 ci.yml）。
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/spa-badge-farm"
    paths:
      - "src/**"
      - "resource/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/slim-windows.yml"

concurrency:
  group: slim-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Fetch submodules
        shell: bash
        run: bash ./.github/scripts/sync-optional-submodules.sh --init --depth 1 src/MaaUtils 3rdparty/EmulatorExtras

      - name: Cache MaaDeps
        id: cache-maadeps
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ./src/MaaUtils/MaaDeps
          key: ${{ runner.os }}-x64-maadeps-${{ hashFiles('tools/maadeps-download.py') }}

      - name: Bootstrap MaaDeps
        if: steps.cache-maadeps.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/maadeps-download.py x64-windows

      - name: Restore build cache
        id: cache-build
        uses: actions/cache@v6
        continue-on-error: true
        with:
          # VS 生成器 + MSBuild 支持增量编译：缓存 build/ 里的目标文件。
          # key 用源文件 hash（改动即失效），restore-keys 前缀匹配最近一次缓存，
          # 让「只改一个 .cpp」时其余 .obj 复用，MSBuild 只重编改动文件并重链接。
          path: |
            build/**/*.obj
            build/**/*.lib
            build/**/*.dll
            build/**/*.exe
            build/**/*.tlog
          key: ${{ runner.os }}-x64-build-${{ hashFiles('src/MaaCore/**') }}
          restore-keys: |
            ${{ runner.os }}-x64-build-

      - name: Configure CMake
        shell: bash
        run: |
          # /Z7（Embedded）让调试信息进 .obj，避免 .pdb 参与增量判断、加快重编译
          cmake -B build --preset windows-publish-x64 \
            -DMAA_HASH_VERSION='0.0.1' \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build MaaCore
        run: cmake --build build --config RelWithDebInfo --target MaaCore --parallel $env:NUMBER_OF_PROCESSORS

      - name: Build apphost and updater
        run: |
          cmake --build build --config RelWithDebInfo --target MaaAppHostStub --parallel $env:NUMBER_OF_PROCESSORS
          cmake --build build --config RelWithDebInfo --target MAA.Updater --parallel $env:NUMBER_OF_PROCESSORS

      - name: Generate global.json
        shell: bash
        run: echo '{"sdk":{"version":"10.0.302","rollForward":"disable"}}' > global.json

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-x64-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}

      - name: Restore WPF GUI
        run: dotnet restore src/MaaWpfGui/MaaWpfGui.csproj

      - name: Publish WPF GUI
        run: dotnet publish src/MaaWpfGui/MaaWpfGui.csproj -c Release -p:Platform=x64 -o install

      - name: Install MaaCore
        run: cmake --install build --config RelWithDebInfo

      - name: Replace apphost
        shell: bash
        run: cp build/bin/RelWithDebInfo/MaaAppHostStub.exe install/MAA.exe

      - name: Prepare drop-in files
        shell: bash
        run: |
          mkdir -p dropin/resource/tasks/MiniGame
          cp install/MaaCore.dll dropin/
          cp install/MAA.dll dropin/
          cp install/MAA.exe dropin/
          cp install/resource/tasks/MiniGame/SPA.json dropin/resource/tasks/MiniGame/
          ls -l dropin

      - name: Upload drop-in files
        uses: actions/upload-artifact@v7
        with:
          name: MAA-spa-dropin-win-x64
          path: dropin/**
          compression-level: 9
